name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome-stable"

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Restore .env
        run: cp /home/ubuntu/prepilot-backend.env .env

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf .cache/puppeteer ~/.cache/puppeteer
          npm ci --ignore-scripts

      - name: Build project
        run: npm run build --if-present

      - name: Restart PM2 process
        run: |
          sudo pm2 restart prepilot_backend --update-env || sudo pm2 start server.js --name prepilot_backend