name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean corrupted Puppeteer cache & Install dependencies
        run: |
          # Remove incomplete Chrome downloads if the executable is missing
          if [ -d ".cache/puppeteer" ] && [ -z "$(find .cache/puppeteer -name 'chrome' -type f 2>/dev/null)" ]; then
            echo "Cleaning incomplete local Puppeteer cache..."
            rm -rf .cache/puppeteer
          fi
          if [ -d "$HOME/.cache/puppeteer" ] && [ -z "$(find "$HOME/.cache/puppeteer" -name 'chrome' -type f 2>/dev/null)" ]; then
            echo "Cleaning incomplete global Puppeteer cache..."
            rm -rf "$HOME/.cache/puppeteer"
          fi
          npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Restart PM2 process
        run: |
          sudo pm2 restart prepilot_backend --update-env || sudo pm2 start server.js --name prepilot_backend
